<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11120f" />
    <meta name="description" content="A DevFlow Digital cria sites, sistemas para organizar clientes e vendas, e agentes de inteligência artificial para empresas." />
    <meta property="og:title" content="DevFlow Digital — Soluções digitais para empresas" />
    <meta property="og:description" content="Sites profissionais, organização de clientes e vendas, e inteligência artificial para negócios." />
    <meta property="og:type" content="website" />
    <meta name="app-base" content="%BASE_URL%" />
    <meta property="og:image" content="%BASE_URL%logo-dfd.png" />
    <link rel="icon" type="image/png" href="%BASE_URL%logo-dfd.png" />
    <title>DevFlow Digital — Soluções digitais para empresas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      const redirectPath = new URLSearchParams(window.location.search).get('__ghPagesRedirect')
      if (redirectPath) {
        const basePath = document.querySelector('meta[name="app-base"]').content.replace(/\/$/, '')
        const routePath = redirectPath.startsWith('/') ? redirectPath : `/${redirectPath}`
        window.history.replaceState(null, '', `${basePath}${routePath}`)
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
