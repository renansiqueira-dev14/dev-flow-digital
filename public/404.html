<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevFlow Digital</title>
    <script>
      const basePath = '/dev-flow-digital/'
      const path = window.location.pathname.startsWith(basePath)
        ? window.location.pathname.slice(basePath.length)
        : window.location.pathname.replace(/^\/+/, '')
      const route = `/${path}${window.location.search}${window.location.hash}`
      window.location.replace(`${basePath}?__ghPagesRedirect=${encodeURIComponent(route)}`)
    </script>
  </head>
  <body></body>
</html>
